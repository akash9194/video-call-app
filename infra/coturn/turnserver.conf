# coturn TURN/STUN server configuration for the video-call-app calling
# feature. See docs/TURN_SERVER_SETUP.md for the full deployment
# walkthrough (this file alone is not enough -- DNS, firewall, and TLS
# certs are covered there).
#
# Copy this to /etc/turnserver.conf on the server, fill in the values
# marked CHANGE-ME, and enable the coturn systemd service.

# --- Identity -------------------------------------------------------
# Must match the domain name you point at this server (see the guide).
realm=turn.your-domain.com
server-name=turn.your-domain.com

# --- Listening ports --------------------------------------------------
listening-port=3478
tls-listening-port=5349
# Bind on all interfaces; the VPS itself is expected to have one public IP.
listening-ip=0.0.0.0

# --- Relay port range ---------------------------------------------------
# Actual media relayed through TURN uses a port from this range per
# active relayed session. Keep it reasonably sized and open it in your
# firewall/security group (see the guide) -- narrower ranges are easier
# to lock down but limit how many concurrent relayed calls this box can
# carry.
min-port=49160
max-port=49200

# --- Authentication -------------------------------------------------
# Time-limited credentials only -- the backend mints a fresh
# username/password per user per call via HMAC-SHA1(this secret), see
# app/config.py:Settings.turn_credentials. There is no static TURN
# username/password anywhere in the app or mobile client.
use-auth-secret
static-auth-secret=CHANGE-ME-must-match-TURN_SHARED_SECRET-in-backend-env
lt-cred-mech

# --- TLS (recommended) ------------------------------------------------
# Lets calls still connect from networks that block plain UDP/TCP (some
# hospital/corporate firewalls do). Obtain certs via certbot -- see the
# guide -- then point these at the resulting files.
# cert=/etc/letsencrypt/live/turn.your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.your-domain.com/privkey.pem

# --- Hardening --------------------------------------------------------
# Refuses to relay to/from addresses that look like your own private
# infrastructure, loopback, link-local, etc. -- standard coturn advice to
# avoid the TURN server being abused as an open relay into your network.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Don't let clients query this server's own config/stats.
no-cli
no-tlsv1
no-tlsv1_1

# --- Logging ------------------------------------------------------------
log-file=/var/log/turnserver/turnserver.log
verbose

# --- Misc -----------------------------------------------------------
fingerprint
stale-nonce=600
